{% extends "base.html" %}

{% block title %}Регистрация - Nexus{% endblock %}

{% block content %}
<div class="container">
    <div class="form-box">
        <h2 class="text-center mb-4">Регистрация</h2>

        <!-- если при проверке нашлась ошибка, показываем ее -->
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form action="/register" method="post">

            <div class="mb-3">
                <label for="username" class="form-label">Логин</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Почта</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" required>
                <div class="form-text">Не меньше 6 символов</div>
            </div>

            <div class="mb-3">
                <label for="password2" class="form-label">Повторите пароль</label>
                <input type="password" class="form-control" id="password2" name="password2" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
        </form>
    </div>
</div>
{% endblock %}
